name: CD Pipeline

on:
  workflow_dispatch:  # Enable manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}  # e.g., us-east-1

      - name: Deploy to AWS Lambda
        run: |
          # 1. Package the application (create a deployment package)
          zip -r deployment.zip app/ utils/  # Include app and utils directories

          # 2. Define Lambda function name and other settings
          FUNCTION_NAME="your-lambda-function-name" # Replace with your function name
          RUNTIME="python3.9"  # Or another supported runtime
          HANDLER="app.handler"  # e.g., app.handler

          # 3. Check if the function exists
          aws lambda get-function --function-name $FUNCTION_NAME --query 'Configuration.FunctionArn' --output text
          FUNCTION_EXISTS=$?

          # 4. Deploy or update the function
          if [ $FUNCTION_EXISTS -eq 0 ]; then
            # Function exists, update the code
            aws lambda update-function-code --function-name $FUNCTION_NAME --zip-file fileb://deployment.zip
            echo "Lambda function code updated."
          else
            # Function does not exist, create it
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --runtime $RUNTIME \
              --handler $HANDLER \
              --zip-file fileb://deployment.zip \
              --role arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/lambda-execution-role \ # Replace
              --publish \
              --region ${{ secrets.AWS_REGION }}
            echo "Lambda function created."
          fi
