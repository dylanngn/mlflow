name: CI Pipeline

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main  # Trigger on pull requests to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Example of linting (optional)
      #- name: Lint with Flake8
      #  run: |
      #    pip install flake8
      #    flake8 app utils/ data_utils.py model_utils.py report_utils.py run.py  --max-line-length=120

      # Example of running tests (optional)
      #- name: Run tests
      #  run: |
      #    #  Add your test commands here
      #    echo "Running tests..."

      - name: Evaluate and Generate Report
        run: |
          python utils/report_utils.py  # Generate the report
          #  Add error handling here.  If the python script fails, the
          #  action should fail.
          echo "Model evaluation and report generation complete"

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: model_comparison_report.json